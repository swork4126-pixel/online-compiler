<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Compiler</title>

<!-- Monaco Editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#0d1117;
    color:#e6edf3;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:64px;
    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#0d1117;
    border-bottom:1px solid #30363d;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:21px;
    font-weight:700;
}

.controls{
    display:flex;
    align-items:center;
    gap:8px;
}

#language{
    width:150px;
    height:40px;

    padding:0 12px;

    background:#161b22;
    color:#fff;

    border:1px solid #30363d;
    border-radius:6px;

    outline:none;

    font-size:14px;
}

#language:focus{
    border-color:#8b5cf6;
}

.run-btn,
.stop-btn{
    height:40px;

    padding:0 18px;

    color:#fff;

    border:0;
    border-radius:6px;

    font-weight:700;
    cursor:pointer;
}

.run-btn{
    background:#7c3aed;
}

.run-btn:hover{
    background:#6d28d9;
}

.stop-btn{
    display:none;
    background:#dc2626;
}

.stop-btn:hover{
    background:#b91c1c;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;

    display:grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(360px, 42%);

    gap:10px;

    padding:10px;
}

/* =========================
   EDITOR
========================= */

.editor-panel{
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;

    background:#1e1e1e;

    border:1px solid #30363d;
    border-radius:7px;

    overflow:hidden;
}

.editor-top{
    height:40px;
    min-height:40px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    background:#161b22;

    border-bottom:1px solid #30363d;

    font-size:13px;
}

.file-name{
    display:flex;
    align-items:center;
    gap:8px;

    color:#d0d7de;
}

.file-dot{
    width:9px;
    height:9px;

    border-radius:50%;

    background:#3b82f6;
}

.editor-status{
    color:#3fb950;
}

#editor{
    flex:1;
    min-height:0;
}

/* =========================
   TERMINAL
========================= */

.terminal-panel{
    min-width:0;
    min-height:0;

    display:flex;
    flex-direction:column;

    background:#000;

    border:1px solid #30363d;
    border-radius:7px;

    overflow:hidden;
}

.terminal-top{
    height:42px;
    min-height:42px;

    display:flex;
    align-items:center;

    background:#161b22;

    border-bottom:1px solid #30363d;
}

.tab{
    height:42px;

    display:flex;
    align-items:center;

    padding:0 15px;

    color:#8b949e;

    font-size:13px;

    cursor:pointer;

    border-bottom:2px solid transparent;
}

.tab:hover{
    color:#fff;
}

.tab.active{
    color:#fff;
    border-bottom-color:#8b5cf6;
}

.terminal-actions{
    margin-left:auto;

    display:flex;
    align-items:center;

    gap:8px;

    padding-right:10px;
}

.status-label{
    color:#8b949e;
    font-size:11px;
}

.clear-btn{
    height:28px;

    padding:0 10px;

    border:1px solid #30363d;

    border-radius:5px;

    background:#21262d;

    color:#c9d1d9;

    cursor:pointer;

    font-size:11px;
}

.clear-btn:hover{
    background:#30363d;
}

/* =========================
   TAB AREA
========================= */

.terminal-content{
    flex:1;
    min-height:0;
    position:relative;
}

.tab-page{
    position:absolute;

    inset:0;

    display:none;

    flex-direction:column;

    min-height:0;
}

.tab-page.active{
    display:flex;
}

/* =========================
   OUTPUT
========================= */

.terminal-output{
    flex:1;
    min-height:0;

    overflow:auto;

    padding:14px;

    background:#000;

    color:#00ff66;

    font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;

    font-size:14px;

    line-height:1.6;

    white-space:pre-wrap;

    word-break:break-word;
}

.error-output{
    color:#ff7b72;
}

.info-output{
    color:#79c0ff;
}

/* =========================
   INLINE TERMINAL INPUT
========================= */

.terminal-command{
    min-height:46px;

    display:flex;
    align-items:flex-start;

    padding:10px 14px;

    border-top:1px solid #202020;

    background:#080808;
}

.prompt{
    color:#3fb950;

    font-family:
        Consolas,
        Monaco,
        monospace;

    font-size:14px;

    padding-top:5px;

    user-select:none;
}

#terminalInput{
    flex:1;

    min-width:0;

    min-height:26px;

    padding:4px 8px;

    border:0;

    outline:none;

    resize:none;

    overflow:hidden;

    background:transparent;

    color:#fff;

    font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;

    font-size:14px;

    line-height:1.5;
}

#terminalInput::placeholder{
    color:#555;
}

/* =========================
   FOOTER
========================= */

.footer{
    height:28px;
    min-height:28px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 12px;

    background:#161b22;

    border-top:1px solid #30363d;

    color:#8b949e;

    font-size:11px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

    html,
    body{
        overflow:auto;
    }

    .header{
        height:auto;
        min-height:64px;

        flex-wrap:wrap;

        gap:10px;

        padding:10px;
    }

    .logo{
        width:100%;
    }

    .controls{
        width:100%;
    }

    #language{
        flex:1;
        width:auto;
    }

    .main{
        grid-template-columns:1fr;

        min-height:1000px;
    }

    .editor-panel{
        min-height:500px;
    }

    .terminal-panel{
        min-height:450px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="logo">
        🚀 Online Compiler
    </div>

    <div class="controls">

        <select id="language">

            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
            <option value="php">PHP</option>
            <option value="c">C</option>
            <option value="cpp">C++</option>
            <option value="java">Java</option>
            <option value="go">Go</option>
            <option value="rust">Rust</option>

        </select>

        <button
            id="runButton"
            class="run-btn"
            onclick="runCode()">

            ▶ Run Code

        </button>

        <button
            id="stopButton"
            class="stop-btn"
            onclick="stopCode()">

            ■ Stop

        </button>

    </div>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="main">

    <!-- EDITOR -->

    <section class="editor-panel">

        <div class="editor-top">

            <div class="file-name">

                <span class="file-dot"></span>

                <span id="fileName">
                    main.py
                </span>

            </div>

            <span
                id="editorStatus"
                class="editor-status">

                Ready

            </span>

        </div>

        <div id="editor"></div>

    </section>


    <!-- TERMINAL -->

    <section class="terminal-panel">

        <div class="terminal-top">

            <div
                id="outputTabButton"
                class="tab active"
                onclick="showTab('output')">

                Output

            </div>

            <div
                id="errorTabButton"
                class="tab"
                onclick="showTab('error')">

                Error

            </div>

            <div
                id="infoTabButton"
                class="tab"
                onclick="showTab('info')">

                Info

            </div>

            <div class="terminal-actions">

                <span
                    id="terminalStatus"
                    class="status-label">

                    Ready

                </span>

                <button
                    class="clear-btn"
                    onclick="clearTerminal()">

                    Clear

                </button>

            </div>

        </div>


        <div class="terminal-content">

            <!-- OUTPUT PAGE -->

            <div
                id="outputPage"
                class="tab-page active">

                <div
                    id="output"
                    class="terminal-output">

                    Online Compiler

                    Ready.

                    Select a language and click Run Code.

                </div>


                <!-- INPUT IS INSIDE SAME TERMINAL -->

                <div class="terminal-command">

                    <span class="prompt">
                        $
                    </span>

                    <textarea
                        id="terminalInput"
                        rows="1"
                        placeholder="Type input here and press Enter..."
                        disabled></textarea>

                </div>

            </div>


            <!-- ERROR PAGE -->

            <div
                id="errorPage"
                class="tab-page">

                <div
                    id="errorOutput"
                    class="terminal-output error-output">

                    No errors.

                </div>

            </div>


            <!-- INFO PAGE -->

            <div
                id="infoPage"
                class="tab-page">

                <div
                    id="infoOutput"
                    class="terminal-output info-output">

                    Compiler is ready.

                </div>

            </div>

        </div>

    </section>

</main>


<!-- FOOTER -->

<footer class="footer">

    <span id="connectionStatus">
        Connecting...
    </span>

    <span>
        Ctrl + Enter = Run
    </span>

</footer>


<script>

/* ===================================
   VARIABLES
=================================== */

let editor = null;

let socket = null;

let running = false;


/* ===================================
   LANGUAGE TEMPLATES
=================================== */

const templates = {

    python:{
        file:"main.py",
        language:"python",
        code:
`print("Enter two numbers:")

a = int(input())
b = int(input())

print("Sum =", a + b)`
    },

    javascript:{
        file:"main.js",
        language:"javascript",
        code:
`const fs = require("fs");

const input =
    fs.readFileSync(0, "utf8")
    .trim()
    .split(/\\s+/)
    .map(Number);

const a = input[0];
const b = input[1];

console.log("Sum =", a + b);`
    },

    php:{
        file:"main.php",
        language:"php",
        code:
`<?php

echo "Enter two numbers:\\n";

$a = intval(trim(fgets(STDIN)));
$b = intval(trim(fgets(STDIN)));

echo "Sum = " . ($a + $b) . PHP_EOL;

?>`
    },

    c:{
        file:"main.c",
        language:"c",
        code:
`#include <stdio.h>

int main() {

    int a, b;

    printf("Enter two numbers: ");

    scanf("%d %d", &a, &b);

    printf("Sum = %d\\n", a + b);

    return 0;
}`
    },

    cpp:{
        file:"main.cpp",
        language:"cpp",
        code:
`#include <iostream>

using namespace std;

int main() {

    int a, b;

    cout << "Enter two numbers: ";

    cin >> a >> b;

    cout << "Sum = "
         << a + b
         << endl;

    return 0;
}`
    },

    java:{
        file:"Main.java",
        language:"java",
        code:
`import java.util.Scanner;

public class Main {

    public static void main(String[] args) {

        Scanner sc =
            new Scanner(System.in);

        System.out.print(
            "Enter two numbers: "
        );

        int a = sc.nextInt();
        int b = sc.nextInt();

        System.out.println(
            "Sum = " + (a + b)
        );
    }
}`
    },

    go:{
        file:"main.go",
        language:"go",
        code:
`package main

import "fmt"

func main() {

    var a, b int

    fmt.Print("Enter two numbers: ")

    fmt.Scan(&a, &b)

    fmt.Println("Sum =", a+b)
}`
    },

    rust:{
        file:"main.rs",
        language:"rust",
        code:
`use std::io::{self, Read};

fn main() {

    let mut input = String::new();

    io::stdin()
        .read_to_string(&mut input)
        .unwrap();

    let values: Vec<i32> =
        input
        .split_whitespace()
        .map(|x| x.parse().unwrap())
        .collect();

    println!("Sum = {}",
        values[0] + values[1]
    );
}`
    }

};


/* ===================================
   MONACO CONFIG
=================================== */

require.config({

    paths:{
        vs:
        "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
    }

});


require(
    ["vs/editor/editor.main"],
    function(){

        editor =
            monaco.editor.create(
                document.getElementById(
                    "editor"
                ),
                {
                    value:
                        templates.python.code,

                    language:
                        templates.python.language,

                    theme:"vs-dark",

                    automaticLayout:true,

                    minimap:{
                        enabled:false
                    },

                    fontSize:14,

                    lineNumbers:"on",

                    scrollBeyondLastLine:false,

                    wordWrap:"off",

                    tabSize:4,

                    padding:{
                        top:12
                    }
                }
            );

    }
);


/* ===================================
   WEBSOCKET
=================================== */

function connectWebSocket(){

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";


    const wsUrl =
        protocol +
        "//" +
        location.host +
        "/ws";


    socket =
        new WebSocket(wsUrl);


    socket.onopen =
        function(){

            document.getElementById(
                "connectionStatus"
            ).textContent =
                "● Connected";

            terminalStatus(
                "Connected"
            );

            setInfo(
                "Connected to compiler server."
            );

        };


    socket.onmessage =
        function(event){

            let message;

            try{

                message =
                    JSON.parse(
                        event.data
                    );

            }catch(error){

                return;
            }


            if(
                message.type ===
                "output"
            ){

                appendOutput(
                    message.data
                );

            }


            else if(
                message.type ===
                "error"
            ){

                appendError(
                    message.data
                );

            }


            else if(
                message.type ===
                "started"
            ){

                running = true;

                document.getElementById(
                    "terminalInput"
                ).disabled = false;

                document.getElementById(
                    "terminalInput"
                ).focus();

                terminalStatus(
                    "Running"
                );

            }


            else if(
                message.type ===
                "finished"
            ){

                running = false;

                document.getElementById(
                    "terminalInput"
                ).disabled = true;

                document.getElementById(
                    "runButton"
                ).style.display =
                    "inline-block";

                document.getElementById(
                    "stopButton"
                ).style.display =
                    "none";

                terminalStatus(
                    "Finished"
                );

                document.getElementById(
                    "editorStatus"
                ).textContent =
                    "Completed";

            }


            else if(
                message.type ===
                "stopped"
            ){

                running = false;

                document.getElementById(
                    "terminalInput"
                ).disabled = true;

                document.getElementById(
                    "runButton"
                ).style.display =
                    "inline-block";

                document.getElementById(
                    "stopButton"
                ).style.display =
                    "none";

                appendOutput(
                    "\n[Program stopped]\n"
                );

                terminalStatus(
                    "Stopped"
                );

            }


            else if(
                message.type ===
                "info"
            ){

                setInfo(
                    message.data
                );

            }

        };


    socket.onclose =
        function(){

            document.getElementById(
                "connectionStatus"
            ).textContent =
                "● Disconnected";


            document.getElementById(
                "connectionStatus"
            ).style.color =
                "#f85149";


            terminalStatus(
                "Disconnected"
            );

        };


    socket.onerror =
        function(){

            document.getElementById(
                "connectionStatus"
            ).textContent =
                "● Connection error";

        };

}


/* ===================================
   TERMINAL INPUT
=================================== */

document
    .getElementById(
        "terminalInput"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter" &&
                !event.shiftKey
            ){

                event.preventDefault();


                if(!running){
                    return;
                }


                const value =
                    this.value;


                appendOutput(
                    value + "\n"
                );


                if(
                    socket &&
                    socket.readyState ===
                    WebSocket.OPEN
                ){

                    socket.send(
                        JSON.stringify({
                            type:"input",
                            data:
                                value + "\n"
                        })
                    );

                }


                this.value = "";

            }

            else if(
                event.key === "c" &&
                event.ctrlKey
            ){

                event.preventDefault();

                stopCode();

            }

        }
    );


/* ===================================
   LANGUAGE CHANGE
=================================== */

document
    .getElementById(
        "language"
    )
    .addEventListener(
        "change",
        function(){

            const lang =
                this.value;

            const config =
                templates[lang];


            document.getElementById(
                "fileName"
            ).textContent =
                config.file;


            if(editor){

                editor.setValue(
                    config.code
                );


                monaco.editor
                    .setModelLanguage(
                        editor.getModel(),
                        config.language
                    );

            }


            document.getElementById(
                "editorStatus"
            ).textContent =
                "Ready";


            clearTerminal();


            setInfo(
                "Language changed to " +
                lang.toUpperCase()
            );

        }
    );


/* ===================================
   RUN
=================================== */

function runCode(){

    if(!editor){
        return;
    }


    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){

        showError(
            "Compiler server is not connected."
        );

        showTab("error");

        return;
    }


    const code =
        editor.getValue();


    const language =
        document.getElementById(
            "language"
        ).value;


    if(!code.trim()){

        showError(
            "Code is empty."
        );

        showTab("error");

        return;
    }


    clearTerminal();


    appendOutput(
        "$ Running " +
        language.toUpperCase() +
        "...\n\n"
    );


    running = true;


    document.getElementById(
        "runButton"
    ).style.display =
        "none";


    document.getElementById(
        "stopButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "terminalInput"
    ).disabled = false;


    document.getElementById(
        "terminalInput"
    ).value = "";


    document.getElementById(
        "terminalInput"
    ).focus();


    document.getElementById(
        "editorStatus"
    ).textContent =
        "Running";


    terminalStatus(
        "Running"
    );


    socket.send(
        JSON.stringify({
            type:"run",
            code:code,
            language:language
        })
    );

}


/* ===================================
   STOP
=================================== */

function stopCode(){

    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify({
                type:"stop"
            })
        );

    }

}


/* ===================================
   OUTPUT
=================================== */

function appendOutput(text){

    const output =
        document.getElementById(
            "output"
        );

    output.textContent += text;

    output.scrollTop =
        output.scrollHeight;

}


/* ===================================
   ERROR
=================================== */

function appendError(text){

    const error =
        document.getElementById(
            "errorOutput"
        );

    error.textContent += text;

    error.scrollTop =
        error.scrollHeight;

    showTab("error");

}


/* ===================================
   SHOW ERROR
=================================== */

function showError(text){

    document.getElementById(
        "errorOutput"
    ).textContent =
        text;

}


/* ===================================
   INFO
=================================== */

function setInfo(text){

    document.getElementById(
        "infoOutput"
    ).textContent =
        text;

}


/* ===================================
   TERMINAL STATUS
=================================== */

function terminalStatus(text){

    document.getElementById(
        "terminalStatus"
    ).textContent =
        text;

}


/* ===================================
   TABS
=================================== */

function showTab(name){

    const outputPage =
        document.getElementById(
            "outputPage"
        );

    const errorPage =
        document.getElementById(
            "errorPage"
        );

    const infoPage =
        document.getElementById(
            "infoPage"
        );


    outputPage.classList.remove(
        "active"
    );

    errorPage.classList.remove(
        "active"
    );

    infoPage.classList.remove(
        "active"
    );


    document.getElementById(
        "outputTabButton"
    ).classList.remove(
        "active"
    );

    document.getElementById(
        "errorTabButton"
    ).classList.remove(
        "active"
    );

    document.getElementById(
        "infoTabButton"
    ).classList.remove(
        "active"
    );


    if(name === "output"){

        outputPage.classList.add(
            "active"
        );

        document.getElementById(
            "outputTabButton"
        ).classList.add(
            "active"
        );

    }


    else if(name === "error"){

        errorPage.classList.add(
            "active"
        );

        document.getElementById(
            "errorTabButton"
        ).classList.add(
            "active"
        );

    }


    else if(name === "info"){

        infoPage.classList.add(
            "active"
        );

        document.getElementById(
            "infoTabButton"
        ).classList.add(
            "active"
        );

    }

}


/* ===================================
   CLEAR
=================================== */

function clearTerminal(){

    document.getElementById(
        "output"
    ).textContent = "";


    document.getElementById(
        "errorOutput"
    ).textContent =
        "No errors.";


    document.getElementById(
        "terminalInput"
    ).value = "";


    terminalStatus(
        "Ready"
    );


    showTab(
        "output"
    );

}


/* ===================================
   CTRL + ENTER
=================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.ctrlKey &&
            event.key === "Enter"
        ){

            event.preventDefault();

            runCode();

        }

    }
);


/* ===================================
   START
=================================== */

connectWebSocket();

</script>

</body>
</html>
