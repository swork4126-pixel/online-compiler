<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Multi Language Compiler</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 20px auto;
    padding: 20px;
}

h1{
    margin-bottom:20px;
}

select{
    padding:10px;
    margin-bottom:10px;
}

textarea{
    width:100%;
    height:350px;
    font-family: Consolas, monospace;
    font-size:15px;
    padding:10px;
}

button{
    padding:10px 20px;
    cursor:pointer;
    margin-top:10px;
}

#output{
    background:#111;
    color:#00ff00;
    padding:15px;
    margin-top:20px;
    min-height:120px;
    white-space:pre-wrap;
    border-radius:5px;
}
</style>

</head>
<body>

<h1>Multi Language Compiler</h1>

<select id="language" onchange="changeTemplate()">
    <option value="python">Python</option>
    <option value="javascript">JavaScript</option>
    <option value="php">PHP</option>
    <option value="c">C</option>
    <option value="cpp">C++</option>
    <option value="java">Java</option>
    <option value="go">Go</option>
    <option value="rust">Rust</option>
</select>

<br>

<textarea id="code">print("Hello World")</textarea>

<br>

<button onclick="runCode()">Run Code</button>

<h3>Output</h3>

<div id="output"></div>

<script>

function changeTemplate(){

const lang =
document.getElementById("language").value;

const editor =
document.getElementById("code");

if(lang==="python"){
editor.value=`print("Hello World")`;
}

else if(lang==="javascript"){
editor.value=`console.log("Hello World");`;
}

else if(lang==="php"){
editor.value=`<?php
echo "Hello World";
?>`;
}
